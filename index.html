<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087ce8">
  <meta
    name="description"
    content="Pack Larry's garbage truck, crush complete lines, and leave no trash behind."
  >
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dumppit — Pack the Truck">
  <meta property="og:description" content="Fit garbage into the truck and crush complete rows and columns.">
  <meta property="og:url" content="https://dumppit.com/">
  <meta property="og:image" content="https://dumppit.com/assets/game/title-screen.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="canonical" href="https://dumppit.com/">
  <link rel="icon" href="assets/dumppit-mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/game/title-screen.jpg" as="image" type="image/jpeg">
  <link rel="stylesheet" href="css/styles.css?v=20260818-6">
  <script type="module" src="js/app.js?v=20260818-6"></script>

  <title>Dumppit — Pack the Truck</title>
</head>
<body>
  <main class="app">
    <section id="title-screen" class="title-screen" aria-label="Dumppit game menu">
      <div class="title-card">
        <img
          class="title-card__art"
          src="assets/game/title-screen.jpg"
          width="941"
          height="1672"
          alt="Larry leaning against the Dumppit garbage truck"
          draggable="false"
        >
        <button id="play-button" class="play-hotspot" type="button" disabled>
          <span class="sr-only">Play Dumppit</span>
        </button>
        <p id="loading-label" class="loading-label">Starting the compactor…</p>
      </div>
    </section>

    <section id="game-screen" class="game-screen" aria-label="Dumppit game" hidden>
      <div id="game-shell" class="game-shell">
        <canvas
          id="game-canvas"
          class="game-canvas"
          tabindex="0"
          aria-label="Drag garbage shapes into the truck and complete rows or columns"
        ></canvas>

        <div class="hud">
          <button id="pause-button" class="hud-button hud-button--pause" type="button" aria-label="Pause game">Ⅱ</button>

          <div class="level-panel">
            <span class="level-panel__label">PACK THE TRUCK</span>
            <div class="route-progress">
              <span class="route-progress__truck" aria-hidden="true">▰</span>
              <span class="route-progress__track">
                <span id="route-progress-fill" class="route-progress__fill"></span>
              </span>
              <span class="route-progress__finish" aria-hidden="true"></span>
            </div>
          </div>

          <div class="score-panel">
            <span>SCORE</span>
            <strong id="score-value">0</strong>
          </div>

          <div class="lives-panel lines-panel">
            <span id="lines-value">0 / 8</span>
            <small>LINES CRUSHED</small>
          </div>
        </div>

        <p id="control-hint" class="control-hint">DRAG GARBAGE INTO THE TRUCK</p>

        <div id="pause-panel" class="modal-panel" hidden>
          <div class="modal-card">
            <p class="modal-card__eyebrow">COMPACTOR STOPPED</p>
            <h2>The route is waiting.</h2>
            <button id="resume-button" class="game-button" type="button">Resume</button>
            <button class="text-button" data-menu type="button">Back to menu</button>
          </div>
        </div>

        <div id="result-panel" class="modal-panel" hidden>
          <div class="modal-card modal-card--result">
            <p id="result-eyebrow" class="modal-card__eyebrow">TRUCK PACKED</p>
            <h2 id="result-title">Load secured!</h2>
            <blockquote id="larry-verdict">“Not completely terrible.”</blockquote>
            <p class="final-score">Score <strong id="final-score">0</strong></p>
            <button id="again-button" class="game-button" type="button">Play again</button>
            <button class="text-button" data-menu type="button">Back to menu</button>
          </div>
        </div>
      </div>
    </section>

    <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <noscript>
    <p class="noscript-message">The compactor needs JavaScript.</p>
  </noscript>
</body>
</html>
