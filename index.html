<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta
    name="description"
    content="Put it into words. Dump it. It is not saved anywhere."
  >
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dumppit — leave it here">
  <meta property="og:description" content="Put it into words. Dump it. When it is gone, it is gone.">
  <meta property="og:url" content="https://dumppit.com/">
  <meta property="og:image" content="https://dumppit.com/assets/dumppit-void-clean.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="canonical" href="https://dumppit.com/">

  <title>Dumppit — leave it here</title>

  <link rel="icon" href="assets/dumppit-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=20260817-6">
  <script src="js/void.js?v=20260817-5" defer></script>
  <script src="js/app.js?v=20260817-4" defer></script>
</head>
<body>
  <div class="void" aria-hidden="true">
    <canvas id="void-canvas" class="void__canvas" width="900" height="900"></canvas>
    <div class="void__depth"></div>
  </div>

  <main class="experience">
    <header class="brand">
      <img
        class="brand__logo"
        src="assets/dumppit-logo.png"
        width="1536"
        height="1024"
        alt="Dumppit"
        decoding="async"
        draggable="false"
      >
    </header>

    <section class="dump-card" aria-label="Write a dump">
      <div class="dump-card__content">
        <form id="dump-form" novalidate>
          <label class="sr-only" for="dump-text">Write a dump</label>
          <div class="dump-field">
            <textarea
              id="dump-text"
              maxlength="600"
              rows="5"
              autofocus
              autocomplete="off"
              autocapitalize="sentences"
              autocorrect="off"
              spellcheck="false"
              data-gramm="false"
              data-gramm_editor="false"
            ></textarea>
            <span class="dump-field__cursor" aria-hidden="true"></span>
          </div>

          <button id="dump-button" class="dump-button" type="submit" disabled>
            <span class="dump-button__label">Dump</span>
          </button>
        </form>
      </div>
    </section>

    <p id="dump-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <noscript>
    <p class="noscript-message">Dumppit needs JavaScript to make your words disappear.</p>
  </noscript>
</body>
</html>
